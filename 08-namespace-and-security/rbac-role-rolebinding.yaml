apiVersion: v1                                      # Core Kubernetes API version
kind: ServiceAccount                                # Kind of RBAC role being referenced
metadata:                                           # Resource metadata section
  name: read-pods                                   # Name of this resource or component
  namespace: dev                                    # Example development environment value
---
apiVersion: rbac.authorization.k8s.io/v1            # API group/version Kubernetes uses to validate this resource
kind: Role                                          # Namespaced RBAC Role resource
metadata:                                           # Resource metadata section
  name: pod-reader                                  # Name of this resource or component
  namespace: dev                                    # Example development environment value
rules:                                              # RBAC permission rules granted by this Role
  - apiGroups: [""]                                 # API groups covered by this RBAC rule
    resources: ["pods"]                             # Defines CPU and memory requests and limits for the container
    verbs: ["get", "list", "watch"]                 # Allowed actions on the listed resources
---
apiVersion: rbac.authorization.k8s.io/v1            # API group/version Kubernetes uses to validate this resource
kind: RoleBinding                                   # Binds RBAC permissions to subjects in this namespace
metadata:                                           # Resource metadata section
  name: read-pods-binding                           # Name of this resource or component
  namespace: dev                                    # Example development environment value
subjects:                                           # Users, groups or ServiceAccounts receiving the role permissions
  - kind: ServiceAccount                            # Kind of subject or role referenced here
    name: read-pods                                 # Name of this resource or component
    namespace: dev                                  # Example development environment value
roleRef:                                            # Role or ClusterRole whose permissions are granted by this binding
  apiGroup: rbac.authorization.k8s.io               # API group that owns the referenced RBAC role kind
  kind: Role                                        # Namespaced RBAC Role resource
  name: pod-reader                                  # Name of this resource or component
