apiVersion: apps/v1                                 # API version for workload controllers
kind: Deployment                                    # Kubernetes Deployment resource
metadata:                                           # Resource metadata section
  name: probed-web                                  # Name of this resource or component
spec:                                               # Desired state/configuration for this resource
  replicas: 2                                       # Desired number of Pod replicas
  selector:                                         # Selects the Pods managed or affected by this resource
    matchLabels:                                    # Labels that must match the selected Pods or nodes
      app: probed-web                               # Example label value used by selectors or organisation
  template:                                         # Pod template used by the controller to create Pods
    metadata:                                       # Resource metadata section
      labels:                                       # Key/value labels used for grouping and selecting resources
        app: probed-web                             # Example label value used by selectors or organisation
    spec:                                           # Desired state/configuration for this resource
      containers:                                   # List of containers that will run inside each Pod
        - name: nginx                               # Name of this list item/resource
          image: nginx:stable                       # Image and tag used to create the container
          ports:                                    # Ports exposed by the container or Service configuration
            - containerPort: 80                     # Port the application listens on inside the container
          startupProbe:                             # Checks whether the application has finished starting
            httpGet:                                # Performs an HTTP request to check application health
              path: /                               # URL path matched by the Ingress rule
              port: 80                              # Port exposed by the Service
            periodSeconds: 5                        # How often Kubernetes runs the probe
            failureThreshold: 30                    # Consecutive failures before the probe is considered failed
          livenessProbe:                            # Checks whether the container should be restarted
            httpGet:                                # Performs an HTTP request to check application health
              path: /                               # URL path matched by the Ingress rule
              port: 80                              # Port exposed by the Service
            periodSeconds: 10                       # How often Kubernetes runs the probe
            timeoutSeconds: 2                       # Maximum time allowed for one probe attempt
            failureThreshold: 3                     # Consecutive failures before the probe is considered failed
          readinessProbe:                           # Checks whether the Pod is ready to receive Service traffic
            httpGet:                                # Performs an HTTP request to check application health
              path: /                               # URL path matched by the Ingress rule
              port: 80                              # Port exposed by the Service
            periodSeconds: 5                        # How often Kubernetes runs the probe
            timeoutSeconds: 2                       # Maximum time allowed for one probe attempt
            failureThreshold: 3                     # Consecutive failures before the probe is considered failed
