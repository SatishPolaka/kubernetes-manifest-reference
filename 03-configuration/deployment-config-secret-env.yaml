apiVersion: apps/v1                                 # API version for workload controllers
kind: Deployment                                    # Kubernetes Deployment resource
metadata:                                           # Resource metadata section
  name: app-with-config                             # Name of this resource or component
spec:                                               # Desired state/configuration for this resource
  replicas: 2                                       # Desired number of Pod replicas
  selector:                                         # Selects the Pods managed or affected by this resource
    matchLabels:                                    # Labels that must match the selected Pods or nodes
      app: configured-app                           # Example label value used by selectors or organisation
  template:                                         # Pod template used by the controller to create Pods
    metadata:                                       # Resource metadata section
      labels:                                       # Key/value labels used for grouping and selecting resources
        app: configured-app                         # Example label value used by selectors or organisation
    spec:                                           # Desired state/configuration for this resource
      containers:                                   # List of containers that will run inside each Pod
        - name: app                                 # Name of this list item/resource
          image: satishpolaka/cars:v1               # Image and tag used to create the container
          ports:                                    # Ports exposed by the container or Service configuration
            - containerPort: 80                     # Port the application listens on inside the container
          # Import every key from the ConfigMap as an environment variable.
          envFrom:                                  # Imports multiple keys from ConfigMaps or Secrets as environment variables
            - configMapRef:
                name: web-config                    # Name of this resource or component
            - secretRef:
                name: app-credentials               # Name of this resource or component
          # Individual key mapping example:
          # env:
          #   - name: LOG_LEVEL
          #     valueFrom:
          #       configMapKeyRef:
          #         name: web-config
          #         key: LOG_LEVEL
          #   - name: DB_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: app-credentials
          #         key: password
