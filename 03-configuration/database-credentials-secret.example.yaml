stringData:

  username: REPLACE_WITH_DATABASE_USERNAME          # Replace this example username with the database username.

  # Replace this placeholder securely.
  password: REPLACE_WITH_DATABASE_PASSWORD          # Do not commit real credentials to a public or shared Git repository.
