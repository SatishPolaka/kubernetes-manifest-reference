apiVersion: v1                                      # Core Kubernetes API version
kind: Secret                                        # Kubernetes Secret resource
metadata:                                           # Resource metadata section
  name: app-credentials                             # Name of this resource or component
type: Opaque                                        # Generic Secret type for application credentials
stringData:                                         # Plain-text Secret input; API server converts it to encoded data
  username: example-user
  password: REPLACE_WITH_SECRET_VALUE               # PLACEHOLDER ONLY: replace securely; never commit a real password
